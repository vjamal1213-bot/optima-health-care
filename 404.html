<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Optima Health Care</title>
    <meta name="robots" content="noindex">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0D2840;
            color: #F6F1EA;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .wrap { max-width: 480px; }
        .num {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(5rem, 20vw, 8rem);
            font-weight: 300;
            color: #58AF9E;
            line-height: 1;
            letter-spacing: -0.03em;
        }
        h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 300;
            margin: 1rem 0 0.75rem;
            letter-spacing: -0.01em;
        }
        p {
            font-size: 0.88rem;
            color: rgba(246,241,234,0.45);
            line-height: 1.8;
            margin-bottom: 2.5rem;
        }
        a.btn {
            display: inline-block;
            background: #58AF9E;
            color: #0D2840;
            padding: 0.9rem 2rem;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            transition: background 0.2s;
        }
        a.btn:hover { background: #6dc4b3; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrap">
        <div class="num">404</div>
        <h1>Page not found.</h1>
        <p>The page you're looking for doesn't exist or has been moved.<br>Let's get you back on track.</p>
        <a href="/" class="btn">Back to Optima &rarr;</a>
    </div>
</body>
</html>
